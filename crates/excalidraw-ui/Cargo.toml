[package]
name = "excalidraw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Interactive editor UI on top of GPUI Kit for the Excalidraw reimplementation."

[dependencies]
excalidraw-core = { path = "../excalidraw-core" }
excalidraw-render = { path = "../excalidraw-render" }
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
base64 = "0.22"
smallvec = "1"
# The "Save to…" dialog names an unnamed scene the way upstream's `getDateTime`
# does, which is local time rather than UTC.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "tiff",
  "webp",
] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
