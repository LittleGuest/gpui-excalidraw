[workspace]
resolver = "2"
members = [
  "crates/excalidraw-core",
  "crates/excalidraw-render",
  "crates/excalidraw-ui",
  "crates/excalidraw",
  "crates/excalidraw-example",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["LittleGuest"]
repository = "https://github.com/LittleGuest/gpui-excalidraw"

[workspace.dependencies]
gpui-kit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
parking_lot = "0.12"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
